server:
  port: 8080
spring:
  profiles:
    default: demo
  datasource:
    url: jdbc:h2:mem:monitor;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
monitoring:
  controller-request-enabled: true
  service-request-enabled: true
  method-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
